name: Build and Release

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!main-*'
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
    build:
        name: Universal Static Files
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci --no-audit --no-fund
            - run: npm run build
            - uses: actions/upload-artifact@v4
              with:
                  name: ZCT-SLMS-Web-static-all-platforms
                  path: dist/
                  if-no-files-found: error

    docker:
        name: Docker Linux x64 + ARM64 / Tag Publish
        needs: [build]
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: docker/setup-buildx-action@v3
            - name: Docker Metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/zct-studio/zct-slms-web
                  tags: |
                      type=ref,event=tag
                      type=ref,event=pr
                      type=sha,prefix=sha-
                      type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            - name: Log in to GHCR (tags only)
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build image; push only for v* tag
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    release:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        needs: [build, docker]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: ZCT-SLMS-Web-static-all-platforms
                  path: dist
            - name: Archive Universal Static Files
              run: |
                  tar -czf ZCT-SLMS-Web-static.tar.gz -C dist .
                  (cd dist && zip -qr ../ZCT-SLMS-Web-static.zip .)
            - uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ZCT-SLMS Web ${{ github.ref_name }}
                  files: |
                      ZCT-SLMS-Web-static.tar.gz
                      ZCT-SLMS-Web-static.zip
                  fail_on_unmatched_files: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
