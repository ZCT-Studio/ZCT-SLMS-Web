name: Docker Push

# 仅 v* 版本 tag（如 v1.2.3）构建并推送镜像到 GHCR；main 分支 push 不发版
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zct-studio/zct-slms-webui

jobs:
  push:
    name: Build and push image
    # 与后端仓库约定一致：提交信息包含 --nobuild 时跳过
    if: ${{ !contains(github.event.head_commit.message, '--nobuild') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v* tag：版本号去 v 前缀（1.2.3）+ commit sha（sha-abc1234），
      # 仅稳定 tag（不含 '-'，如非 v1.2.3-rc.1）额外打 latest，latest 永远指向最新稳定发布
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
