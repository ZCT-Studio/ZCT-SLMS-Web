name: Docker Build (verify)

# 构建验证：PR（目标 main/dev）与非 main 分支的 push 触发，仅构建不推送；
# main 分支不做构建验证，改由 docker-push 工作流在 main push 时构建并推送镜像
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zct-studio/zct-slms-webui

jobs:
  build:
    name: Build image
    # 与后端仓库约定一致：提交信息或 PR 标题包含 --nobuild 时跳过构建
    if: ${{ !contains(github.event.head_commit.message, '--nobuild') && !contains(github.event.pull_request.title, '--nobuild') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
