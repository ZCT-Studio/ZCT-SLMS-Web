name: Docker Build (verify)

# 构建验证：PR 与任意分支的 push 都会执行，仅构建不推送镜像
on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zct-studio/zct-slms-webui

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
