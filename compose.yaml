name: zct-slms-webui
services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-17316}:80"
    environment:
      BACKEND_FORWARD_MODE: "${BACKEND_FORWARD_MODE:-off}"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-}"
      BACKEND_URL: "${BACKEND_URL:-http://host.docker.internal:17112}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

