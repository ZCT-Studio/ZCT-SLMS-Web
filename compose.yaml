name: zct-slms-web
services:
  web:
    build:
      context: .
      args:
        ZCT_SLMS_BUILD_NODE_IMAGE: "${ZCT_SLMS_BUILD_NODE_IMAGE:-node:22-alpine}"
        ZCT_SLMS_BUILD_NGINX_IMAGE: "${ZCT_SLMS_BUILD_NGINX_IMAGE:-nginx:alpine}"
        ZCT_SLMS_BUILD_NPM_REGISTRY: "${ZCT_SLMS_BUILD_NPM_REGISTRY:-https://registry.npmjs.org/}"
    ports:
      - "${ZCT_SLMS_WEB_PORT:-17316}:80"
    environment:
      ZCT_SLMS_WEB_API_URL: "${ZCT_SLMS_WEB_API_URL:-}"
      ZCT_SLMS_WEB_FORWARD_MODE: "${ZCT_SLMS_WEB_FORWARD_MODE:-proxy}"
      ZCT_SLMS_WEB_REDIRECT_URL: "${ZCT_SLMS_WEB_REDIRECT_URL:-}"
      ZCT_SLMS_WEB_PROXY_URL: "${ZCT_SLMS_WEB_PROXY_URL:-http://host.docker.internal:17112}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

